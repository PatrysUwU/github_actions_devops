name: lab_8_415904

on:
  push:
    branches:
      - lab_8/415904
    
jobs:
  unit_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install libs for testing
      run: |
        pip  install pytest 
    
    - name: prepare environemnt 
      run: |
        python -m pip install -r ./env_415904/requirements.txt
      
    - name: Run test
      run: |
        cd ./env_415904/main && pytest calculator_test.py 

  function_test:
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install libs for testing
      run: |
        pip  install pytest 
    
    - name: prepare environemnt 
      run: |
        python -m pip install -r ./env_415904/requirements.txt
    - name: run flask app
      env:
        FLASK_APP: ./env_415904/main/app.py
      run: |
          nohup flask run --host=127.0.0.1 --port=5000 &

    - name: Wait for Flask to start
      run: |
        for i in {1..10}; do
          if curl -s http://127.0.0.1:5000 > /dev/null; then
            echo "Flask server is up!"
            break
          fi
          echo "Waiting for Flask..."
          sleep 2
        done

    - name: Run test
      run: |
        cd ./env_415904/main && pytest app_test.py 
  deploy:
    needs: function_test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_415904_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_415904_TOKEN }}

    - name: Build the Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_415904_USERNAME }}/lab_app:latest .

    - name: Push the Docker image
      run: |
        docker push ${{ secrets.DOCKER_HUB_415904_USERNAME }}/lab_app:latest
